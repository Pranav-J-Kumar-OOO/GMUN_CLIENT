<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GMUN Client Portal — Dashboard</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; background-color: #f9f9f9; }
    h2 { color: #333; }
    #user-profile { border: 1px solid #ddd; padding: 20px; border-radius: 6px; max-width: 320px; background-color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    button { padding: 10px 20px; background-color: #d32f2f; color: white; border: none; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <h2>GMUN Portal</h2>

  <div id="user-profile">
    <h3>Welcome, <span id="user-email" style="color: #0288d1;"></span>!</h3>
    <div id="client-details">Fetching details...</div>
    <br />
    <button id="logout-btn">Sign Out</button>
  </div>

  <script type="module" src="dashboard.js"></script>
</body>
</html>
