<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GMUN Client Portal</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; background-color: #f9f9f9; }
    h2 { color: #333; }
    input { display: block; margin: 12px 0; padding: 10px; width: 280px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 20px; background-color: #0288d1; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #01579b; }
    #user-profile { border: 1px solid #ddd; padding: 20px; border-radius: 6px; max-width: 320px; background-color: white; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
  </style>
</head>
<body>

  <h2>GMUN Portal</h2>

  <!-- 1. SIGN IN FORM -->
  <div id="login-form">
    <h3>Please Sign In</h3>
    <input type="email" id="email" placeholder="Email Address" required />
    <input type="password" id="password" placeholder="Password" required />
    <button id="login-btn">Sign In</button>
  </div>

  <!-- 2. USER PROFILE CONTAINER -->
  <div id="user-profile" style="display: none;">
    <h3>Welcome, <span id="user-email" style="color: #0288d1;"></span>!</h3>
    <div id="client-details">Fetching details...</div>
    <br />
    <button id="logout-btn" style="background-color: #d32f2f;">Sign Out</button>
  </div>

  <!-- 3. CONNECT TO EXTERNAL JS FILE -->
  <script type="module" src="script.js"></script>
</body>
</html>
