<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GMUN Client Portal — Sign In</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 40px; background-color: #f9f9f9; }
    h2 { color: #333; }
    input { display: block; margin: 12px 0; padding: 10px; width: 280px; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 10px 20px; background-color: #0288d1; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #01579b; }
    #status { color: #d32f2f; margin-top: 8px; min-height: 20px; }
  </style>
</head>
<body>

  <h2>GMUN Portal</h2>

  <div id="login-form">
    <h3>Please Sign In</h3>
    <input type="email" id="email" placeholder="Email Address" required />
    <input type="password" id="password" placeholder="Password" required />
    <button id="login-btn">Sign In</button>
    <div id="status"></div>
  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
